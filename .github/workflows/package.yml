# 22 Packaging: builds the installers on demand (Actions → Package → Run
# workflow). Each job runs the app's --self-test on the result and
# uploads it as an artifact.
#
# macOS, in the oxrok organization, is three jobs, so that the signing keys
# are never in the job that runs the build (the crates' build scripts,
# Homebrew, third-party actions) or the app:
#
#   macos         builds and bundles the app, signed ad-hoc. No secrets.
#   macos-sign    signs it with the Developer ID certificate and has Apple
#                 notarize it. The only job with the keys: it builds nothing
#                 and runs nothing from the build.
#   macos-verify  opens the .dmg as a user would and runs the app. No secrets.
#
# Elsewhere (a fork) macos uploads its ad-hoc signed .dmg and the other two
# are skipped.
name: Package

on:
  workflow_dispatch:
    inputs:
      macos:
        description: macOS .dmg (signed and notarized)
        type: boolean
        default: true
      linux:
        description: Linux AppImage
        type: boolean
        default: true
      windows:
        description: Windows installer
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: inputs.macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install libsigrokdecode
      - run: make firmware-deps
      - run: make bundle
      # For macos-sign: the app as `make bundle` left it. A tar, as an
      # artifact's zip loses the file modes.
      - if: github.repository_owner == 'oxrok'
        run: tar -C dist -cf macos-app.tar Oxrok.app
      - if: github.repository_owner == 'oxrok'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: macos-app.tar
          retention-days: 1
      - if: github.repository_owner != 'oxrok'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.dmg

  # The Developer ID signature and Apple's notarization. The keys are five
  # organization secrets, given to the one step that uses them:
  #
  #   MACOS_CERT_P12, MACOS_CERT_PASSWORD   the Developer ID Application
  #       certificate and its key (base64 of the .p12), and its password
  #   MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID
  #       an App Store Connect API key (the .p8) for the notary service
  #
  # Keeping them in:
  # - No action runs while the keys exist. The steps before are `gh` and
  #   `tar`; the one after, when the keychain and the key files are deleted,
  #   is GitHub's upload-artifact, pinned to a commit whose dist/ was
  #   rebuilt from its source and compared.
  # - Nothing from the build is run here. The app is data to sign, and the
  #   script that signs it is this commit's, not the artifact's.
  # - The tools are Apple's: security, codesign, notarytool, stapler.
  macos-sign:
    needs: macos
    if: github.repository_owner == 'oxrok'
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: The app from the build, and this commit's packaging script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name macos-app --dir "$RUNNER_TEMP"
          mkdir dist
          tar -C dist -xf "$RUNNER_TEMP/macos-app.tar"
          # After the tar, and outside the workspace, so that nothing in
          # the artifact can stand in for it.
          mkdir "$RUNNER_TEMP/packaging"
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/packaging/macos/bundle.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/packaging/bundle.py"
      - name: Sign, notarize and staple
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "::error::the secret $name is not set for this repository"; exit 1; }
          done

          # A keychain of this job's own, deleted with the key files when
          # the step ends, however it ends.
          keys="$RUNNER_TEMP/signing"
          keychain="$keys/signing.keychain-db"
          mkdir "$keys"
          cleanup() {
            security delete-keychain "$keychain" 2> /dev/null || true
            rm -rf "$keys"
          }
          trap cleanup EXIT
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$keys/certificate.p12"
          security import "$keys/certificate.p12" -f pkcs12 -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          # By its hash: the name has a non-ASCII letter, and is not unique.
          identity() {
            security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ && !id { id = $2 } END { print id }'
          }
          hash=$(identity)
          if [ -z "$hash" ]; then
            # Not valid without its issuer, where the runner lacks it.
            curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$keys/DeveloperIDG2CA.cer"
            security import "$keys/DeveloperIDG2CA.cer" -k "$keychain"
            hash=$(identity)
          fi
          [ -n "$hash" ] || { echo "::error::MACOS_CERT_P12 has no valid Developer ID Application identity"; exit 1; }

          printf '%s\n' "$MACOS_NOTARY_KEY" > "$keys/AuthKey.p8"
          python3 -I "$RUNNER_TEMP/packaging/bundle.py" --stage package --out dist --sign "$hash" \
            --notary-key "$keys/AuthKey.p8" --notary-key-id "$MACOS_NOTARY_KEY_ID" --notary-issuer "$MACOS_NOTARY_ISSUER_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.dmg

  # What a user gets: the downloaded .dmg, mounted, and the app run from it
  # under the hardened runtime.
  macos-verify:
    needs: macos-sign
    runs-on: macos-15
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name macos --dir dmg
          dmg=$(ls dmg/*.dmg)
          xcrun stapler validate "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          app="$RUNNER_TEMP/dmg/Oxrok.app"
          xcrun stapler validate "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign --verify --strict --check-notarization -R=notarized "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)'
          spctl --assess --type execute --verbose=2 "$app"
          "$app/Contents/MacOS/oxrok-ui" --self-test
          "$app/Contents/MacOS/oxrok" --version | head -n 1

  linux:
    if: inputs.linux
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsigrokdecode4 \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            file desktop-file-utils
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
      - run: make firmware-deps
      - run: cargo build --release
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          packaging/linux/appimage.sh target/release/oxrok-ui "$VERSION" dist
      - name: Self-test
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: dist/*.AppImage --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*.AppImage

  windows:
    if: inputs.windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make curl tar
            mingw-w64-x86_64-rust mingw-w64-x86_64-clang mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libsigrokdecode
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - run: make firmware-deps
      - name: Build, self-test and installer
        run: |
          export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          packaging/windows/build.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*-setup.exe
