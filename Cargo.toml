[package]
name = "oxrok-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
# Decided 2026-10-19: GPL-3.0-or-later, matching the sigrok stack it ports.
# Full text in LICENSE.
license = "GPL-3.0-or-later"
description = "A Rust/egui logic analyzer, built on oxrok"
repository = "https://github.com/oxrok/ui"
homepage = "https://github.com/oxrok/ui"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxrok-ui"
path = "src/main.rs"

[features]
# The built-in mock devices and the Rust mock decoders; with it, the
# binary uses the mock backend instead of the oxrok one.
mock = []
# The Python protocol decoders on the system's CPython, through pyo3.
python = ["oxrok/python"]
# The native macOS menu bar instead of the in-window one
# (macOS only; elsewhere this does nothing).
macos-menu = ["dep:muda", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Palette matching (skim algorithm).
fuzzy-matcher = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.14", default-features = false }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "persistence", "clipboard", "links"] }
rfd = "0.17"
dirs = "7"
pollster = "1"
log = { version = "0.4", features = ["std"] }
# Pure Rust, with RustPython built in, so no C library and no Python
# installation are needed.
oxrok = { version = "=0.2.0", default-features = false, features = ["nusb", "rustpython"] }
# The firmware registry: downloads what a device is missing over HTTPS
# (ureq, rustls), or takes it from the vendor's software.
oxrok-firmware-fetch = "0.2"
serialport = { version = "4", default-features = false }

# Cmd+Q must reach the app, not winit's default macOS menu.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
muda = { version = "0.21", optional = true, default-features = false }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu", "eframe"] }
tempfile = "3"
rand = "0.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# The mock generator and the store run per sample; keep debug builds fast
# enough for real-time capture.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
