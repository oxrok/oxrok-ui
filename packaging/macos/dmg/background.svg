<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 420" width="660" height="420">
<!-- The window of the macOS .dmg (bundle.py has the numbers): the app's icon at (170, 165),
     Applications at (490, 165), 128 pt icons, their names on the steel below. Finder on macOS 15
     writes the names in black in both appearances; steel is as legible under white, should
     another version write them so. The window shows the top 400 pt; the rest is for a taller
     one. `make dmg-background` renders the PNGs. -->
<defs>
<linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#15161c"/><stop offset="1" stop-color="#557a9c"/>
</linearGradient>
</defs>
<rect width="660" height="420" fill="#c8501e"/>
<path d="M-10 350H58V318H118V350H150V318H240V350H300V318H330V350H420V318H452V350H512V318H602V350H670V-10H-10Z" fill="#557a9c"/>
<rect width="660" height="178" fill="#15161c"/>
<rect y="177" width="660" height="46" fill="url(#dusk)"/>
<path d="M-10 350H58V318H118V350H150V318H240V350H300V318H330V350H420V318H452V350H512V318H602V350H670" fill="none" stroke="#15161c" stroke-width="8" stroke-linejoin="miter"/>
<image xlink:href="data:image/png;base64," x="282.0" y="30" width="96" height="28.05"/>
<g fill="none" stroke="#e6edf3" stroke-width="6" stroke-linejoin="miter" opacity="0.85">
<path d="M266 173H296V155H326V173H372"/>
<path d="M370 157L392 173L370 189Z" fill="#e6edf3" stroke="none"/>
</g>
</svg>
